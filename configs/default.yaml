experiment:
  name: "rag_baseline"
  seed: 42

model:
  provider: "openai_compatible"
  name: "llama3.1:8b"
  base_url: "http://localhost:11434/v1"
  temperature: 0.0
  max_tokens: 1024

embeddings:
  provider: "sentence-transformers"
  name: "sentence-transformers/all-MiniLM-L6-v2"

retrieval:
  top_k: 5
  chunk_size: 500
  chunk_overlap: 50
  index_path: "data/processed/index.faiss"
  chunks_path: "data/processed/chunks.jsonl"  

pipeline:
  max_iterations: 1

generation:
  require_context: true
  require_citations: true
  json_output: true

evaluation:
  questions_path: "data/evaluation/questions.jsonl"
  min_questions: 10

paths:
  data: "data"
  raw_data: "data/raw"
  processed_data: "data/processed"
  outputs: "outputs"
  experiments: "experiments"
  logs: "outputs/logs"
