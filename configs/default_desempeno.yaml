experiment:
  name: "rag_baseline_dominio"
  seed: 42

model:
  provider: "openai_compatible"
  name: "gpt-4o-mini"
  base_url: "https://api.openai.com/v1"
  temperature: 0.9
  max_tokens: 1024

embeddings:
  provider: "sentence-transformers"
  name: "sentence-transformers/all-MiniLM-L6-v2"

retrieval:
  top_k: 5
  chunk_size: 500
  chunk_overlap: 50
  index_path: "data/processed/auditoria_desempeno/index.faiss"
  chunks_path: "data/processed/auditoria_desempeno/chunks.jsonl"

pipeline:
  max_iterations: 10

adaptive:
  max_steps: 12
  max_retries: 2
  min_evidence: 2
  sufficient_evidence: 5

generation:
  require_context: false
  require_citations: false
  json_output: true

evaluation:
  questions_path: "data/evaluation/questions_auditoria_desempeno.jsonl"
  min_questions: 10

paths:
  data: "data"
  raw_data: "data/raw/auditoria_desempeno"
  processed_data: "data/processed/auditoria_desempeno"
  outputs: "outputs/rag_baseline_dominio"
  baseline_qa_outputs: "outputs/rag_baseline_dominio_qa"
  agentic_deterministic_outputs: "outputs/rag_agentic_deterministic_dominio"
  agentic_deterministic_prolog_outputs: "outputs/rag_agentic_deterministic_dominio_prolog"
  agentic_adaptive_outputs: "outputs/rag_agentic_adaptive_dominio"
  experiments: "experiments"
  logs: "outputs/rag_baseline_dominio/logs"
  agentic_deterministic_logs: "outputs/rag_agentic_deterministic_dominio/logs"
