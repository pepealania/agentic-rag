[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag"
version = "0.1.0"
description = "Reproducible prototype for agentic RAG workflows"
requires-python = ">=3.12,<3.13"

dependencies = [
    "langgraph==1.2.9",
    "typing-extensions==4.16.0",
    "pyyaml==6.0.2",
    "pydantic==2.11.7",
    "numpy==2.3.2",
    "faiss-cpu==1.11.0",
    "sentence-transformers==5.1.0",
    "requests==2.32.4",
    "openai==1.109.1",    
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
