[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag"
version = "0.1.0"
description = "Reproducible prototype for agentic RAG workflows"
requires-python = ">=3.12,<3.13"

dependencies = [
    "langgraph==1.2.9",
    "typing-extensions==4.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
